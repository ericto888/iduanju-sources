name: Validate source catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate catalog and plugin manifests
        run: python3 scripts/validate_catalog.py
      - name: Syntax-check Huanggua source
        run: node --check sources/com.eric.idj.huanggua/main.js
      - name: Test XVideos stream extraction
        run: node --test tests/xvideos.test.mjs
